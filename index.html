<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Screen Editor</title>
<style>
  :root {
    --bg: #1c1c1e; --surface: #2c2c2e; --surface-2: #242426; --line: #3a3a3c;
    --text: #f2f2f7; --muted: #98989f; --primary: #0a84ff; --danger: #ff375f;
    --orb: 52px; --cell: 70px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex; flex-direction: column; -webkit-user-select: none; user-select: none;
  }

  header {
    height: 52px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 12px 0 0; }
  #search {
    width: 240px; height: 32px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit;
  }
  #search:focus, .folder-name:focus { outline: none; border-color: var(--primary); }
  #status { margin-left: auto; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.error { color: var(--danger); }
  #status.ok { color: #30d158; }
  button {
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
    transition: background-color 120ms ease, opacity 120ms ease;
  }
  button:hover:not(:disabled) { background: #3a3a3c; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }
  button.primary:hover:not(:disabled) { background: #2b95ff; }
  button.small { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }

  main { flex: 1; min-height: 0; display: flex; }
  #pages {
    width: calc(var(--cell) * 4 + 50px); flex: none; overflow-y: auto;
    border-right: 1px solid var(--line); padding: 8px 16px 24px;
  }
  #board { flex: 1; overflow-y: auto; padding: 16px; }

  .page { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .page-head h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .count.over { color: var(--danger); }
  .grid {
    display: grid; grid-template-columns: repeat(4, var(--cell)); grid-auto-rows: 84px;
    min-height: 84px; border-radius: 10px; border: 1px dashed transparent; padding: 2px;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .grid.dock { background: var(--surface-2); border-color: var(--line); border-style: solid; }
  .grid.empty { border-color: var(--line); }

  .orb, .tile, .ph { width: var(--cell); display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .orb { cursor: grab; }
  .orb img, .orb .fallback, .tile .mini {
    width: var(--orb); height: var(--orb); border-radius: 50%; flex: none;
  }
  .orb img { display: block; object-fit: cover; box-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none; }
  .orb .fallback {
    display: grid; place-items: center; background: #48484a; font-size: 20px; font-weight: 600;
  }
  .label {
    width: calc(var(--cell) - 4px); margin-top: 5px; font-size: 11px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); pointer-events: none;
  }
  .orb.dragging, .tile.dragging, .widget.dragging { opacity: .3; }
  .dim { opacity: .18; }
  .hit img { box-shadow: 0 0 0 3px var(--primary); }

  .ph::before {
    content: ""; width: var(--orb); height: var(--orb); border-radius: 50%;
    border: 2px dashed var(--primary); background: rgba(10,132,255,.12);
  }
  .ph.wide { grid-column: span 2; grid-row: span 2; width: auto; }
  .ph.wide::before { width: 128px; height: 128px; border-radius: 22px; }

  .tile { cursor: grab; }
  .tile .mini {
    border-radius: 14px; background: rgba(120,120,128,.32); padding: 6px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    transition: box-shadow 120ms ease;
  }
  .tile .mini img { width: 100%; aspect-ratio: 1; border-radius: 50%; display: block; pointer-events: none; }
  .tile.over .mini { box-shadow: 0 0 0 3px var(--primary); }

  .widget {
    grid-column: span 2; grid-row: span 2; margin: 4px 6px 10px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line); padding: 12px;
    display: flex; flex-direction: column; justify-content: flex-end; cursor: grab;
  }
  .widget .wname { font-size: 12px; font-weight: 600; }
  .widget .wsub { font-size: 11px; color: var(--muted); }

  .board-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .board-head h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .board-head .hint { color: var(--muted); font-size: 12px; }
  #folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .card {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    transition: border-color 120ms ease;
  }
  .card.flash { border-color: var(--primary); }
  .card-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  .folder-name {
    flex: 1; min-width: 0; height: 28px; padding: 0 6px; margin-left: -6px; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: var(--text);
    font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: text; user-select: text;
  }
  .folder-name:hover { border-color: var(--line); }
  .card .grid { grid-template-columns: repeat(auto-fill, var(--cell)); margin: 6px; min-height: 84px; }
  .card.newfolder { border-style: dashed; display: grid; place-items: center; min-height: 120px; color: var(--muted); text-align: center; padding: 12px; }
  .card.newfolder.over, .grid.over { border-color: var(--primary); background-color: rgba(10,132,255,.06); }

  #addpage { margin-top: 12px; width: 100%; }
  .pages-note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  #unsorted { position: sticky; top: -16px; z-index: 2; background: var(--bg); padding: 16px 0 12px; margin-top: -16px; }
  .card.unsorted { border-style: dashed; transition: border-color 120ms ease, background-color 120ms ease; }
  .card.unsorted .grid { min-height: 84px; max-height: 180px; overflow-y: auto; }
  .card.unsorted.over { border-color: var(--primary); background-color: #1f2a38; }
  .card.unsorted .empty-note { color: var(--muted); font-size: 12px; padding: 0 12px 12px; }
  .card-head .title { flex: 1; font-weight: 600; font-size: 13px; height: 28px; line-height: 28px; }
  .loading { padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Home Screen</h1>
  <input id="search" type="search" placeholder="Find an app" autocomplete="off">
  <button id="undo" disabled title="Undo (⌘Z)">Undo</button>
  <button id="reload" title="Discard changes and re-read the phone">Reload</button>
  <span id="status">Connecting to iPhone…</span>
  <button id="apply" class="primary" disabled>Apply to iPhone</button>
</header>
<main>
  <section id="pages"><div class="loading">Loading…</div></section>
  <section id="board">
    <div class="board-head">
      <h2>Folders</h2>
      <span class="hint">Drag orbs between folders. Drop one anywhere else to send it to Unsorted. Double-click an orb to take it out of its folder. Click a folder name to rename it.</span>
    </div>
    <div id="unsorted"></div>
    <div id="folders"></div>
  </section>
</main>

<script>
const WIDGET_SLOTS = { small: 4, medium: 8, large: 16, extraLarge: 32 };
const $ = s => document.querySelector(s);
const UNSORTED = "Unsorted";
let model = null, apps = {}, version = null, baselineJSON = "", history = [], drag = null, folderSeq = 1000;

function setStatus(text, kind = "") {
  const el = $("#status");
  el.textContent = text; el.className = kind; el.title = text;
}

async function load() {
  setStatus("Reading layout from iPhone…");
  try {
    const r = await fetch("/api/layout");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    apps = d.apps; version = d.version; model = { pages: d.pages, unsorted: [] };
    for (const page of model.pages) {
      const i = page.findIndex(it => it.t === "folder" && it.name === UNSORTED);
      if (i >= 0) { model.unsorted = page.splice(i, 1)[0].apps; break; }
    }
    baselineJSON = JSON.stringify(model); history = [];
    render();
    setStatus(`Loaded from ${d.device}`);
  } catch (e) { setStatus(`Couldn't read the phone: ${e.message}`, "error"); }
}

// ---------- model helpers ----------
const folders = () => model.pages.flat().filter(i => i.t === "folder");
const findFolder = id => folders().find(f => f.id === id);
const slots = (page) => page.reduce((n, i) => n + (i.t === "widget" ? (WIDGET_SLOTS[i.size] || 4) : 1), 0);
const dirty = () => JSON.stringify(model) !== baselineJSON;

function snapshot() { history.push(JSON.stringify(model)); if (history.length > 100) history.shift(); }
function undo() { if (!history.length) return; model = JSON.parse(history.pop()); render(); }

// Remove an item (app / folder / widget) from wherever it is; returns the item object.
function detach(kind, id) {
  for (const page of model.pages) {
    for (let i = 0; i < page.length; i++) {
      const it = page[i];
      if (it.t === kind && it.id === id) return page.splice(i, 1)[0];
      if (kind === "app" && it.t === "folder") {
        const j = it.apps.indexOf(id);
        if (j >= 0) { it.apps.splice(j, 1); return { t: "app", id }; }
      }
    }
  }
  if (kind === "app" && model.unsorted.includes(id)) {
    model.unsorted.splice(model.unsorted.indexOf(id), 1); return { t: "app", id };
  }
  throw new Error(`lost ${kind} ${id}`);
}

function pruneEmptyFolders() {
  model.pages.forEach((p, i) => model.pages[i] = p.filter(it => it.t !== "folder" || it.apps.length));
}

// Where a loose app goes when taken out of a folder: page 2 onward, then page 1, then a new page.
function looseTarget() {
  const order = [...model.pages.keys()].slice(2).concat(1);
  for (const i of order) if (model.pages[i] && slots(model.pages[i]) < 24) return model.pages[i];
  const p = []; model.pages.push(p); return p;
}

function takeOut(id) {
  snapshot(); looseTarget().push(detach("app", id)); render();
  setStatus(`${apps[id].name} moved out of its folder`);
}

function deleteFolder(id) {
  const f = findFolder(id);
  snapshot();
  model.unsorted.push(...f.apps);
  for (const page of model.pages) {
    const i = page.indexOf(f);
    if (i >= 0) page.splice(i, 1);
  }
  render();
  setStatus(`Deleted ${f.name}. ${f.apps.length} app${f.apps.length === 1 ? "" : "s"} moved to Unsorted (⌘Z to undo)`);
}

function lastPageWithRoom() {
  for (let i = model.pages.length - 1; i >= 1; i--) if (slots(model.pages[i]) < 24) return model.pages[i];
  const p = []; model.pages.push(p); return p;
}

// ---------- rendering ----------
function iconImg(id) {
  const img = document.createElement("img");
  img.src = `/icon/${encodeURIComponent(id)}`; img.alt = ""; img.draggable = false;
  return img;
}

function orb(id) {
  const el = document.createElement("div");
  el.className = "orb"; el.draggable = true; el.dataset.kind = "app"; el.dataset.id = id;
  const name = apps[id]?.name || id;
  el.title = name;
  const img = iconImg(id);
  img.onerror = () => {
    const f = document.createElement("div");
    f.className = "fallback"; f.textContent = name.charAt(0).toUpperCase(); img.replaceWith(f);
  };
  const label = document.createElement("div");
  label.className = "label"; label.textContent = name;
  el.append(img, label);
  el.addEventListener("dblclick", () => { if (el.closest(".card")) takeOut(id); });
  return el;
}

function folderTile(f) {
  const el = document.createElement("div");
  el.className = "tile"; el.draggable = true; el.dataset.kind = "folder"; el.dataset.id = f.id;
  el.dataset.zone = "tile"; el.title = `${f.name} (${f.apps.length})`;
  const mini = document.createElement("div"); mini.className = "mini";
  f.apps.slice(0, 9).forEach(a => mini.append(iconImg(a)));
  const label = document.createElement("div"); label.className = "label"; label.textContent = f.name;
  el.append(mini, label);
  el.addEventListener("click", () => {
    const card = document.querySelector(`.card[data-folder="${f.id}"]`);
    if (!card) return;
    card.scrollIntoView({ block: "nearest" });
    card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 900);
  });
  return el;
}

function widgetTile(w) {
  const el = document.createElement("div");
  el.className = "widget"; el.draggable = true; el.dataset.kind = "widget"; el.dataset.id = w.id;
  const n = document.createElement("div"); n.className = "wname"; n.textContent = "Widget stack";
  const s = document.createElement("div"); s.className = "wsub"; s.textContent = w.label;
  el.append(n, s);
  return el;
}

function renderPages() {
  const root = $("#pages"); root.replaceChildren();
  model.pages.forEach((page, i) => {
    const sec = document.createElement("div"); sec.className = "page";
    const head = document.createElement("div"); head.className = "page-head";
    const h = document.createElement("h2"); h.textContent = i === 0 ? "Dock" : `Page ${i}`;
    const used = i === 0 ? page.length : slots(page), cap = i === 0 ? 4 : 24;
    const c = document.createElement("span"); c.className = "count" + (used > cap ? " over" : "");
    c.textContent = `${used}/${cap}`;
    head.append(h, c);
    const grid = document.createElement("div");
    grid.className = "grid" + (i === 0 ? " dock" : "") + (page.length ? "" : " empty");
    grid.dataset.zone = "page"; grid.dataset.page = i;
    for (const it of page) {
      grid.append(it.t === "app" ? orb(it.id) : it.t === "folder" ? folderTile(it) : widgetTile(it));
    }
    sec.append(head, grid);
    root.append(sec);
  });
  const note = document.createElement("p");
  note.className = "pages-note";
  note.textContent = "Apps on these pages sit loose, outside any folder. Drag an orb here to un-folder it.";
  root.prepend(note);
  const add = document.createElement("button");
  add.id = "addpage"; add.textContent = "Add page";
  add.onclick = () => { snapshot(); model.pages.push([]); render(); };
  root.append(add);
}

function renderUnsorted() {
  const root = $("#unsorted"); root.replaceChildren();
  const card = document.createElement("div"); card.className = "card unsorted";
  const head = document.createElement("div"); head.className = "card-head";
  const title = document.createElement("span"); title.className = "title"; title.textContent = "Unsorted";
  const count = document.createElement("span"); count.className = "count"; count.textContent = model.unsorted.length;
  head.append(title, count);
  const grid = document.createElement("div"); grid.className = "grid"; grid.dataset.zone = "unsorted";
  model.unsorted.forEach(a => grid.append(orb(a)));
  card.append(head, grid);
  if (!model.unsorted.length) {
    const n = document.createElement("div"); n.className = "empty-note";
    n.textContent = "Park apps here when you haven't decided where they go. On the phone this becomes a folder called Unsorted.";
    card.append(n);
  }
  root.append(card);
}

function renderBoard() {
  renderUnsorted();
  const root = $("#folders"); root.replaceChildren();
  for (const f of folders()) {
    const card = document.createElement("div"); card.className = "card"; card.dataset.folder = f.id;
    const head = document.createElement("div"); head.className = "card-head";
    const name = document.createElement("input");
    name.className = "folder-name"; name.value = f.name; name.spellcheck = false;
    name.addEventListener("change", () => {
      const v = name.value.trim();
      if (!v || v === f.name) { name.value = f.name; return; }
      snapshot(); f.name = v; render();
    });
    name.addEventListener("keydown", e => { if (e.key === "Enter") name.blur(); if (e.key === "Escape") { name.value = f.name; name.blur(); } });
    const count = document.createElement("span"); count.className = "count"; count.textContent = f.apps.length;
    const sort = document.createElement("button"); sort.className = "small"; sort.textContent = "A–Z";
    sort.title = "Sort this folder alphabetically";
    sort.onclick = () => {
      snapshot();
      f.apps.sort((a, b) => apps[a].name.localeCompare(apps[b].name, undefined, { sensitivity: "base" }));
      render();
    };
    const del = document.createElement("button"); del.className = "small"; del.textContent = "Delete";
    del.title = "Delete this folder. Its apps move to Unsorted.";
    del.onclick = () => deleteFolder(f.id);
    head.append(name, count, sort, del);
    const grid = document.createElement("div");
    grid.className = "grid"; grid.dataset.zone = "folder"; grid.dataset.folder = f.id;
    f.apps.forEach(a => grid.append(orb(a)));
    card.append(head, grid);
    root.append(card);
  }
  const nf = document.createElement("div");
  nf.className = "card newfolder"; nf.dataset.zone = "newfolder";
  nf.textContent = "Drop an app here to start a new folder";
  root.append(nf);
}

function render() {
  pruneEmptyFolders();
  renderPages(); renderBoard(); applySearch();
  $("#undo").disabled = !history.length;
  const changed = dirty();
  $("#apply").disabled = !changed || !!problems().length;
  if (changed) {
    const p = problems();
    setStatus(p.length ? p[0] : "Unsaved changes", p.length ? "error" : "");
  }
}

function problems() {
  const out = [];
  if (model.pages[0].length > 4) out.push("The dock holds at most 4 items");
  model.pages.forEach((p, i) => { if (i && slots(p) > 24) out.push(`Page ${i} is full (${slots(p)}/24)`); });
  return out;
}

// ---------- search ----------
function applySearch() {
  const q = $("#search").value.trim().toLowerCase();
  document.querySelectorAll(".orb").forEach(o => {
    const hit = q && apps[o.dataset.id]?.name.toLowerCase().includes(q);
    o.classList.toggle("dim", !!q && !hit); o.classList.toggle("hit", !!hit);
  });
  document.querySelectorAll(".card[data-folder]").forEach(c => {
    const f = findFolder(c.dataset.folder);
    const hit = !q || f.name.toLowerCase().includes(q) || f.apps.some(a => apps[a].name.toLowerCase().includes(q));
    c.classList.toggle("dim", !hit);
  });
  document.querySelectorAll(".tile").forEach(t => {
    const f = findFolder(t.dataset.id);
    t.classList.toggle("dim", !!q && !(f.name.toLowerCase().includes(q) || f.apps.some(a => apps[a].name.toLowerCase().includes(q))));
  });
}

// ---------- drag and drop ----------
const ph = document.createElement("div");

function zoneAccepts(zone, kind) {
  const z = zone.dataset.zone;
  if (kind === "app") return true;
  if (kind === "folder") return z === "page";
  if (kind === "widget") return z === "page" && zone.dataset.page !== "0";
  return false;
}

function clearMarks() {
  ph.remove();
  document.querySelectorAll(".over").forEach(e => e.classList.remove("over"));
}

// Index (ignoring the dragged element and the placeholder) where a drop at (x, y) lands.
function placeholderBefore(grid, x, y) {
  for (const c of grid.children) {
    if (c === ph || c.classList.contains("dragging")) continue;
    const r = c.getBoundingClientRect();
    if (y < r.top || (y < r.bottom && x < r.left + r.width / 2)) return c;
  }
  return null;
}

// Work out where the current drag would land. Returns { zone, toUnsorted }.
function resolveZone(e) {
  let zone = e.target.closest("[data-zone]");
  // Dropping an app on a folder icon files it; other kinds treat the tile as part of the page.
  if (zone?.dataset.zone === "tile" && (drag.kind !== "app" || zone.dataset.id === drag.id)) zone = zone.parentElement;
  // Headers and padding of a page or folder count as that page or folder.
  if (!zone) zone = e.target.closest(".page, .card:not(.newfolder)")?.querySelector(".grid") || null;
  if (zone && zoneAccepts(zone, drag.kind)) return { zone, toUnsorted: false };
  return { zone: null, toUnsorted: drag.kind === "app" };
}

document.addEventListener("dragstart", e => {
  const el = e.target.closest("[draggable=true]");
  if (!el) return;
  drag = { kind: el.dataset.kind, id: el.dataset.id };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", drag.id);
  ph.className = "ph" + (drag.kind === "widget" ? " wide" : "");
  requestAnimationFrame(() => el.classList.add("dragging"));
});

document.addEventListener("dragover", e => {
  if (!drag) return;
  const { zone, toUnsorted } = resolveZone(e);
  if (!zone && !toUnsorted) { clearMarks(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  if (toUnsorted) {
    ph.remove();
    const tray = document.querySelector(".card.unsorted");
    document.querySelectorAll(".over").forEach(o => o !== tray && o.classList.remove("over"));
    tray.classList.add("over");
    return;
  }
  document.querySelectorAll(".over").forEach(o => o !== zone && o.classList.remove("over"));
  if (zone.dataset.zone === "tile" || zone.dataset.zone === "newfolder") {
    ph.remove(); zone.classList.add("over"); return;
  }
  const before = placeholderBefore(zone, e.clientX, e.clientY);
  if (ph.parentElement !== zone || ph.nextElementSibling !== before) zone.insertBefore(ph, before);
});

document.addEventListener("drop", e => {
  if (!drag) return;
  e.preventDefault();
  const resolved = resolveZone(e);
  if (resolved.toUnsorted) {
    const id = drag.id;
    cleanupDrag();
    if (model.unsorted.includes(id)) return;
    snapshot(); model.unsorted.push(detach("app", id).id); render();
    setStatus(`${apps[id].name} moved to Unsorted`);
    return;
  }
  const zone = resolved.zone;
  if (!zone) return;
  const z = zone.dataset.zone;
  let index = 0;
  if (z === "page" || z === "folder" || z === "unsorted") {
    for (const c of zone.children) {
      if (c === ph) break;
      if (!c.classList.contains("dragging")) index++;
    }
  }
  snapshot();
  const before = JSON.stringify(model);
  const item = detach(drag.kind, drag.id);
  if (z === "page") {
    model.pages[+zone.dataset.page].splice(index, 0, item);
  } else if (z === "folder") {
    findFolder(zone.dataset.folder).apps.splice(index, 0, item.id);
  } else if (z === "unsorted") {
    model.unsorted.splice(index, 0, item.id);
  } else if (z === "tile") {
    findFolder(zone.dataset.id).apps.push(item.id);
  } else if (z === "newfolder") {
    const name = prompt("Name the new folder", "New Folder");
    if (name === null || !name.trim()) { model = JSON.parse(before); history.pop(); cleanupDrag(); render(); return; }
    lastPageWithRoom().push({ t: "folder", id: `n${folderSeq++}`, name: name.trim(), apps: [item.id] });
  }
  if (JSON.stringify(model) === before) history.pop();
  cleanupDrag();
  render();
});

function cleanupDrag() {
  clearMarks();
  document.querySelectorAll(".dragging").forEach(d => d.classList.remove("dragging"));
  drag = null;
}
document.addEventListener("dragend", cleanupDrag);

// ---------- actions ----------
$("#search").addEventListener("input", applySearch);
$("#search").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; applySearch(); } });
$("#undo").onclick = undo;
$("#reload").onclick = () => { if (!dirty() || confirm("Discard your changes and reload from the phone?")) load(); };
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "z" && !e.shiftKey && document.activeElement.tagName !== "INPUT") {
    e.preventDefault(); undo();
  }
});
window.addEventListener("beforeunload", e => { if (model && dirty()) e.preventDefault(); });

function pagesForPhone() {
  const pages = JSON.parse(JSON.stringify(model.pages));
  if (model.unsorted.length) {
    let i = pages.length - 1;
    while (i >= 1 && slots(pages[i]) >= 24) i--;
    if (i < 1) { pages.push([]); i = pages.length - 1; }
    pages[i].push({ t: "folder", id: "unsorted", name: UNSORTED, orig: UNSORTED, apps: [...model.unsorted] });
  }
  return pages;
}

$("#apply").onclick = async () => {
  const btn = $("#apply");
  btn.disabled = true; setStatus("Applying to iPhone…");
  try {
    const r = await fetch("/api/apply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ version, model: { pages: pagesForPhone() } }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    await load();
    setStatus(`Applied to iPhone. Previous layout saved to ${d.backup}`, "ok");
  } catch (e) {
    setStatus(`Not applied: ${e.message}`, "error");
    btn.disabled = false;
  }
};

load();
</script>
</body>
</html>
